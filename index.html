<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>売上・原価管理</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background-color: #f9f9f9; }
        header { background: #333; color: #fff; padding: 10px; text-align: center; position: relative; }
        #loading { display: none; position: absolute; top: 10px; right: 15px; color: yellow; font-weight: bold; }
        .container { display: flex; flex: 1; overflow: hidden; }
        .menu { width: 100px; background: #e0e0e0; padding: 10px 0; display: flex; flex-direction: column; }
        .menu button { padding: 15px 5px; margin-bottom: 5px; border: none; background: none; text-align: left; font-size: 14px; cursor: pointer; }
        .menu button.active { background: #fff; font-weight: bold; }
        .content { flex: 1; padding: 15px; overflow-y: auto; background: #fff; }
        .section { display: none; }
        .section.active { display: block; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 5px; color: #555; }
        .form-group input, .form-group select { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button.submit-btn { padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; width: 100%; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>

    <header>管理システム <span id="loading">通信中...</span></header>

    <div class="container">
        <!-- 左側メニュー -->
        <div class="menu">
            <button onclick="showSection('sales')" class="active" id="btn-sales">売上入力</button>
            <button onclick="showSection('costs')" id="btn-costs">原価入力</button>
            <button onclick="showSection('summary')" id="btn-summary">損益確認</button>
            <button onclick="showSection('categories')" id="btn-categories">カテゴリ</button>
        </div>

        <!-- 右側コンテンツ -->
        <div class="content">
            <!-- 売上入力 -->
            <div id="sales" class="section active">
                <h2>売上入力</h2>
                <div class="form-group"><label>カテゴリ</label><select id="sales-category"></select></div>
                <div class="form-group"><label>金額 (円)</label><input type="number" id="sales-amount"></div>
                <div class="form-group"><label>日付</label><input type="date" id="sales-date"></div>
                <button class="submit-btn" onclick="saveData('sales')">登録</button>
            </div>

            <!-- 原価入力 -->
            <div id="costs" class="section">
                <h2>原価入力</h2>
                <div class="form-group"><label>カテゴリ</label><select id="costs-category"></select></div>
                <div class="form-group"><label>金額 (円)</label><input type="number" id="costs-amount"></div>
                <div class="form-group"><label>日付</label><input type="date" id="costs-date"></div>
                <button class="submit-btn" onclick="saveData('costs')">登録</button>
            </div>

            <!-- 損益確認 -->
            <div id="summary" class="section">
                <h2>損益確認</h2>
                <div class="form-group"><label>表示年月を選択</label><input type="month" id="summary-month" onchange="calculateSummary()"></div>
                <h3>月間 (<span id="disp-month"></span>)</h3>
                <p>売上: <span id="sum-sales-month">0</span> 円</p>
                <p>原価: <span id="sum-costs-month">0</span> 円</p>
                <p><strong>利益: <span id="profit-month">0</span> 円</strong></p>
                <hr>
                <h3>年間 (<span id="disp-year"></span>年)</h3>
                <p>売上: <span id="sum-sales-year">0</span> 円</p>
                <p>原価: <span id="sum-costs-year">0</span> 円</p>
                <p><strong>利益: <span id="profit-year">0</span> 円</strong></p>
            </div>

            <!-- カテゴリ登録 -->
            <div id="categories" class="section">
                <h2>カテゴリ登録</h2>
                <div class="form-group"><label>新しいカテゴリ名</label><input type="text" id="new-category"></div>
                <button class="submit-btn" onclick="addCategory()">追加</button>
                <ul id="category-list" style="margin-top: 20px;"></ul>
            </div>
        </div>
    </div>

    <script>
        // ★重要：ステップ2で取得したURLをここに貼ります
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxBrwC_bBPkcgTCJRv6M0rHXyNN-dcbwMOJq85Mp2gOp_PKgz7gpQoLxWenN8ZVJj73/exec"; 

        let db = { categories: [], sales: [], costs: [] };

        // 今日の日付をセット
        document.getElementById('sales-date').valueAsDate = new Date();
        document.getElementById('costs-date').valueAsDate = new Date();
        document.getElementById('summary-month').value = new Date().toISOString().slice(0, 7);

        // GASへリクエストを送る関数
        async function fetchGAS(payload) {
            document.getElementById('loading').style.display = 'inline';
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                document.getElementById('loading').style.display = 'none';
                return result;
            } catch (e) {
                alert("通信エラーが発生しました");
                document.getElementById('loading').style.display = 'none';
                console.error(e);
            }
        }

        // 初期データの読み込み（起動時に実行）
        async function loadInitialData() {
            if(GAS_URL === "ここにコピーしたウェブアプリのURLを貼り付けてください") {
                alert("GASのURLが設定されていません。コードを書き換えてください。");
                return;
            }
            const data = await fetchGAS({ action: 'getData' });
            if (data && data.success) {
                db.categories = data.categories || [];
                db.sales = data.sales || [];
                db.costs = data.costs || [];
                updateCategoryDropdowns();
            }
        }

        // 画面切り替え処理
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.menu button').forEach(el => el.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            document.getElementById('btn-' + sectionId).classList.add('active');
            if (sectionId === 'summary') calculateSummary();
        }

        // カテゴリの更新
        function updateCategoryDropdowns() {
            const selects = [document.getElementById('sales-category'), document.getElementById('costs-category')];
            selects.forEach(select => {
                select.innerHTML = db.categories.map(c => `<option value="${c}">${c}</option>`).join('');
            });
            const list = document.getElementById('category-list');
            list.innerHTML = db.categories.map(c => `<li>${c} <button onclick="deleteCategory('${c}')" style="margin-left:10px;">削除</button></li>`).join('');
        }

        // カテゴリ追加
        async function addCategory() {
            const name = document.getElementById('new-category').value;
            if (name && !db.categories.includes(name)) {
                await fetchGAS({ action: 'addCategory', categoryName: name });
                db.categories.push(name);
                document.getElementById('new-category').value = '';
                updateCategoryDropdowns();
                alert('追加しました');
            }
        }
        
        // カテゴリ削除
        async function deleteCategory(name) {
            await fetchGAS({ action: 'deleteCategory', categoryName: name });
            db.categories = db.categories.filter(c => c !== name);
            updateCategoryDropdowns();
        }

        // 売上・原価データの保存
        async function saveData(type) {
            const category = document.getElementById(`${type}-category`).value;
            const amount = Number(document.getElementById(`${type}-amount`).value);
            const date = document.getElementById(`${type}-date`).value;

            if (!amount || !date) return alert('金額と日付を入力してください');

            const actionName = type === 'sales' ? 'addSale' : 'addCost';
            await fetchGAS({ action: actionName, category: category, amount: amount, date: date });
            
            // ローカルのデータも更新しておく
            db[type].push({ category, amount, date });
            
            document.getElementById(`${type}-amount`).value = '';
            alert('登録しました');
        }

        // 損益計算
        function calculateSummary() {
            const selectedMonthStr = document.getElementById('summary-month').value; 
            if (!selectedMonthStr) return;
            const targetYear = selectedMonthStr.split('-')[0];

            document.getElementById('disp-month').textContent = selectedMonthStr;
            document.getElementById('disp-year').textContent = targetYear;

            let salesMonth = 0, costsMonth = 0, salesYear = 0, costsYear = 0;

            db.sales.forEach(item => {
                if (item.date.startsWith(selectedMonthStr)) salesMonth += item.amount;
                if (item.date.startsWith(targetYear)) salesYear += item.amount;
            });

            db.costs.forEach(item => {
                if (item.date.startsWith(selectedMonthStr)) costsMonth += item.amount;
                if (item.date.startsWith(targetYear)) costsYear += item.amount;
            });

            document.getElementById('sum-sales-month').textContent = salesMonth.toLocaleString();
            document.getElementById('sum-costs-month').textContent = costsMonth.toLocaleString();
            document.getElementById('profit-month').textContent = (salesMonth - costsMonth).toLocaleString();

            document.getElementById('sum-sales-year').textContent = salesYear.toLocaleString();
            document.getElementById('sum-costs-year').textContent = costsYear.toLocaleString();
            document.getElementById('profit-year').textContent = (salesYear - costsYear).toLocaleString();
        }

        // アプリ起動時にデータ読み込みを実行
        loadInitialData();
    </script>
</body>
</html>
